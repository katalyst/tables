name: Test

on:
  pull_request:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          cache: yarn
      - name: Setup
        run: |
          bin/setup --skip-server
      - name: Test
        run: |
          bundle exec rake
